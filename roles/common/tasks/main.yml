- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 600

- name: Install base packages
  ansible.builtin.package:
    name: "{{ vmf_packages }}"
    state: present

- name: Set timezone to UTC
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Etc/UTC
    dest: /etc/localtime
    state: link
    force: true
