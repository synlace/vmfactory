- name: Install Docker engine and CLI
  ansible.builtin.package:
    name: "{{ vmf_packages }}"
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Put the provisioning user in the docker group
  ansible.builtin.user:
    name: "{{ vmf_user | default('ubuntu') }}"
    groups: docker
    append: true
